name: Check implementation and pilot experiment
on:
  push:
    branches: [final-ieee-report]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Run automated tests
        run: pytest -q
      - name: Check output on deterministic synthetic images
        run: |
          python -m crack_detection.train --help
